

services:
  # Database Service
  postgres-db:
    image: postgres:17-alpine
    container_name: start_api_postgres
    restart: always
    environment:
      POSTGRES_DB: start_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d start_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Spring Boot Banking API Service
  banking-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: start_api_backend
    restart: always
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/start_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APPLICATION_SECURITY_JWT_SECRET_KEY: bXktc3VwZXItc2VjcmV0LWtleS1mb3Ita2htZXItYmFua2luZy1hcGktMjAyNi1iYWNrZW5kLXNlY3VyaXR5
      APPLICATION_SECURITY_JWT_EXPIRATION: 86400000
    depends_on:
      postgres-db:
        condition: service_healthy

volumes:
  postgres_data:
  