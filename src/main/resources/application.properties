spring.application.name=start_api
server.port = 8081

# 1. PostgreSQL Datasource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/start_db
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver
# 2. JPA / Hibernate Configuration
# ddl-auto: update នឹងជួយបង្កើត ឬកែសម្រួល Table ដោយស្វ័យប្រវត្តិតាម Java Entity
spring.jpa.hibernate.ddl-auto=update
# បង្ហាញ SQL Query លើ Terminal ដើម្បីឱ្យយើងដឹងថា Hibernate កំពុង execute អ្វីខ្លះ
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# កំណត់ Database Dialect សម្រាប់ PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.data.web.pageable.one-indexed-parameters=true
